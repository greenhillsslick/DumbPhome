name: Build dumbOS APK

# Needed so a failing build can write its log back to the commit, and so a
# v* tag can publish a release with the APKs attached.
permissions:
  contents: write

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git describe`/tags are available to the release step.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu images ship the Android SDK already; using it avoids a
      # third-party setup action and its download step.
      - name: Point at the runner's Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "No preinstalled SDK at $SDK" >&2
            exit 1
          fi
          echo "Using SDK at $SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - name: Ensure platform 34 and build-tools
        run: |
          SDK="$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          NEED=""
          [ -d "$SDK/platforms/android-34" ] || NEED="$NEED platforms;android-34"
          [ -d "$SDK/build-tools/34.0.0" ] || NEED="$NEED build-tools;34.0.0"
          if [ -n "$NEED" ]; then
            sdkmanager $NEED
          else
            echo "platform 34 and build-tools 34.0.0 already present"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Cheap, deterministic guards for the drawing invariants that glyph
      # visibility depends on (see tools/test_pixels.py).
      - name: Pixel invariants
        run: |
          python3 tools/test_pixels.py
          python3 tools/test_radio.py
          python3 tools/gen.py && git diff --exit-code web/pixel-widgets.js \
            app/src/main/java/com/dumbos/ui/PixelWidgets.kt \
            app/src/main/java/com/dumbos/apps/radio/Stations.kt web/stations.js \
            web/dumbos.html

      # The radio only predicts playback; the network is the only place a
      # stream can be proved to answer. This never fails the build (stations
      # go down for maintenance), but the table lands in the run summary so a
      # dead station is visible instead of silently shipped.
      - name: Check radio streams
        continue-on-error: true
        run: |
          python3 tools/check_streams.py --timeout 8 | tee /tmp/streams.md
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then cat /tmp/streams.md >> "$GITHUB_STEP_SUMMARY"; fi
          # Logs are not readable from every client; a commit comment is.
          python3 tools/post_streams.py /tmp/streams.md || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # A failed build log is the only useful artefact; post it on the
            # commit so it can be read without the Actions log viewer.
            python3 tools/post_log.py /tmp/build.log
          fi
          exit "$status"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release APK (signed)
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/build-release.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 tools/post_log.py /tmp/build-release.log
          fi
          exit "$status"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the release signature
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          APK=app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
          grep -q "CN=dumbOS" /tmp/certs.txt || { echo "unexpected signer" >&2; exit 1; }

      - name: Audit the release APK
        run: |
          set +e
          tools/audit_apk.sh app/build/outputs/apk/release/app-release.apk summary > /tmp/summary.log 2>&1
          tools/audit_apk.sh app/build/outputs/apk/release/app-release.apk > /tmp/audit.log 2>&1
          status=$?
          cat /tmp/summary.log
          tail -40 /tmp/audit.log
          # Runner logs are not readable from every client; the commit comment is.
          python3 tools/post_audit.py /tmp/summary.log /tmp/audit.log || true
          exit "$status"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report APK contents
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          for apk in app/build/outputs/apk/*/*.apk; do
            echo "== $apk"
            ls -lh "$apk"
            "$BT/aapt2" dump badging "$apk" \
              | grep -E "^(package|application-label|launchable-activity)" || true
          done

      - name: Stage release assets
        run: |
          mkdir -p dist
          # On a branch github.ref_name contains slashes, so only a tag produces
          # release assets; a branch build stops at the plain APK artifact.
          NAME="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'snapshot' }}"
          cp app/build/outputs/apk/release/app-release.apk "dist/dumbOS-${NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/dumbOS-${NAME}-debug.apk"
          cd dist && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
          cd .. && python3 tools/release_notes.py "${NAME}" > dist/RELEASE_NOTES.md
          head -20 dist/RELEASE_NOTES.md

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dumbos-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      # ------------------------------------------------------------------
      # Publishing: only for v* tags. A branch push stops at the artifact.
      # ------------------------------------------------------------------
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: dumbOS ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          # body_path provides the notes; the automatic changelog is appended by
          # tools/release_notes.py itself, so it is not requested twice.
          generate_release_notes: false
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
